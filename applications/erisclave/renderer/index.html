<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Cahier des charges</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Cahier des charges</h1>
      <p>Remplis ta feature, on te sort le HTML propre.</p>
    </header>

    <main>
      <section class="block">
        <h2>Nom de la fonctionnalité</h2>
        <input id="featureName" class="text-input" placeholder="Ex : Gestion des rôles" />
      </section>

      <section class="block">
        <h2>Objectifs (plusieurs réponses)</h2>
        <div id="goalsContainer" class="dynamic-list"></div>
        <button id="addGoal" class="btn-secondary">+ Ajouter une réponse</button>
      </section>

      <section class="block">
        <h2>Champs générés depuis la template</h2>
        <div id="dynamicFields"></div>
      </section>

      <section class="block actions">
        <button id="generate" class="btn-primary">Générer le HTML</button>
      </section>

      <section class="block">
        <h2>Prévisualisation HTML</h2>
        <iframe id="preview" class="preview"></iframe>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
